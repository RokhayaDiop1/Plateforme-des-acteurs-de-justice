<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="/src/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">

        <!-- Colonne image (cachée en mobile) -->
        <div class="hidden lg:block relative">
            <img src="/images/inscription.jpg" alt="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-[#1C2E4A]/60"></div>
            <div class="absolute inset-0 flex flex-col justify-center items-center text-white p-12 text-center">
                <h1 class="text-9xl font-playfair mb-4">Yoon<span class="text-[#C8A75A]">Link</span></h1>
                <p class="text-gray-200">La justice accessible à tous au Sénégal</p>
            </div>
        </div>

        <!-- Colonne formulaire -->
        <div class="flex items-center justify-center px-8 py-10">
            <div class="w-full max-w-md">
                <a href="/index.html" class="lg:hidden flex items-center justify-center pb-10">
                    <img src="/images/logo-removebg.png" alt="" class="w-20">
                    <p class="text-4xl font-bold text-[#1C2E4A] tracking-[0.12em] text-center pt-5">Yoon<span class="text-[#C8A75A]">Link</span></p>
                </a>

                <h2 class="text-4xl font-bold text-[#1C2E4A] mb-2">Créer un compte</h2>
                <p class="text-gray-500 mb-8">Rejoignez YoonLink en quelques secondes</p>

                <form class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Prénom</label>
                            <input type="text" placeholder="Votre prénom" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nom</label>
                            <input type="text" placeholder="Votre nom" required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Adresse e-mail</label>
                        <input type="email" placeholder="vous@exemple.com" required
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Téléphone</label>
                        <input type="tel" placeholder="+221 77 000 00 00" required
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mot de passe</label>
                        <input type="password" placeholder="••••••••" required
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Confirmer le mot de passe</label>
                        <input type="password" placeholder="••••••••" required
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-[#C8A75A] focus:ring-2 focus:ring-amber-100 outline-none transition">
                    </div>

                    <div class="flex items-start gap-2 pt-2">
                        <input type="checkbox" required class="mt-1 accent-[#C8A75A]">
                        <label class="text-sm text-gray-500">
                            J'accepte les <a href="#" class="text-[#C8A75A] hover:underline">conditions d'utilisation</a> et la <a href="#" class="text-[#C8A75A] hover:underline">politique de confidentialité</a>
                        </label>
                    </div>

                    <button type="submit"
                        class="w-full bg-[#1C2E4A] hover:bg-[#C8A75A] text-white font-semibold py-3.5 rounded-lg transition-colors">
                        Créer mon compte
                    </button>
                </form>

                <p class="text-center text-gray-500 mt-6">
                    Déjà un compte ?
                    <a href="connexion.html" class="text-[#C8A75A] font-semibold hover:underline">Se connecter</a>
                </p>

                <p class="text-center text-gray-400 text-sm mt-4">
                    Vous êtes un professionnel du droit ?
                    <a href="/index.html" class="text-[#1C2E4A] font-semibold hover:underline">Inscrivez-vous ici</a>
                </p>
            </div>
        </div>

    </div>
</body>
</html>
